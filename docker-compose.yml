services:
  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes: ["./weights:/app/weights:ro"]
    ports: ["8000:8000"]
    depends_on: [qdrant]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.9.2
    volumes: [qdrant_data:/qdrant/storage]
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped
  grafana:
    image: grafana/grafana:10.4.2
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  qdrant_data:
